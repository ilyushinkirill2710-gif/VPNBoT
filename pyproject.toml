[project]
name = "vpn-telegram-bot"
version = "0.1.0"
description = "Telegram bot for selling VPN subscriptions via Remnawave panel with platega.io payments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiogram>=3.13,<4.0",
    "aiohttp>=3.10,<4.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "remnawave>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vpn-bot = "bot.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]
